<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Balance Whale Widget — Antigravity</title>
  <script src="/preload.js"></script>
  <style>
    :root {
      --bg: var(--background, #f4f7fb);
      --card: var(--card, #ffffff);
      --fg: var(--foreground, #1e293b);
      --muted: var(--muted-foreground, #64748b);
      --border: var(--border, rgba(15, 23, 42, 0.1));
      --accent: #3b82f6;
      --font: var(--font-family, system-ui, -apple-system, "Segoe UI", sans-serif);
    }
    :root[data-theme="dark"] {
      --bg: var(--background, #0f172a);
      --card: var(--card, #1e293b);
      --fg: var(--foreground, #f1f5f9);
      --muted: var(--muted-foreground, #94a3b8);
      --border: var(--border, rgba(255, 255, 255, 0.12));
    }
    * { box-sizing: border-box; user-select: none; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: radial-gradient(circle at 20% 20%, color-mix(in srgb, var(--accent) 10%, var(--bg)), var(--bg));
      color: var(--fg); font-family: var(--font); font-size: 13px;
    }
    .stage {
      position: relative; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: space-between; padding: 12px;
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card); border: 1px solid var(--border);
      padding: 8px 12px; border-radius: 12px; z-index: 5;
    }
    .pill {
      font-size: 11px; padding: 2px 8px; border-radius: 999px;
      background: rgba(59, 130, 246, 0.14); color: var(--accent); font-weight: 600;
    }
    .btn {
      border: 1px solid var(--border); background: var(--card); color: var(--fg);
      padding: 4px 10px; border-radius: 8px; cursor: pointer; font-size: 12px;
    }
    .btn.primary { background: var(--accent); color: #fff; border-color: transparent; }

    /* 可拖拽吸附的 QQ 弹弹小鲸鱼挂件 */
    .whale-widget {
      position: absolute; right: 16px; bottom: 72px;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 22px;
      background: color-mix(in srgb, var(--card) 92%, transparent);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      box-shadow: 0 10px 28px rgba(37, 99, 235, 0.18);
      cursor: grab; touch-action: none; z-index: 20;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), left 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.25s ease;
    }
    .whale-widget.dragging { cursor: grabbing; transition: none; }
    .whale-widget.dock-left { flex-direction: row-reverse; }
    .whale-widget.dock-left .whale-svg { transform: scaleX(-1); }
    .whale-widget.squish { animation: jelly 0.52s cubic-bezier(0.34, 1.56, 0.64, 1); }

    @keyframes jelly {
      0% { transform: scale(1, 1); }
      25% { transform: scale(1.16, 0.84); }
      50% { transform: scale(0.9, 1.12); }
      75% { transform: scale(1.05, 0.96); }
      100% { transform: scale(1, 1); }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .whale-avatar {
      width: 56px; height: 56px; flex-shrink: 0;
      animation: floatY 3s ease-in-out infinite;
    }
    .whale-svg { width: 100%; height: 100%; transition: transform 0.25s ease; }
    .balance-info { display: flex; flex-direction: column; min-width: 102px; }
    .balance-label { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
    .balance-num {
      font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .balance-num.low {
      background: linear-gradient(135deg, #ef4444, #f97316);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .bubble {
      position: absolute; bottom: calc(100% + 10px); right: 8px;
      background: var(--card); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 12px; font-size: 12px;
      white-space: nowrap; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
      opacity: 0; transform: translateY(6px); pointer-events: none;
      transition: all 0.22s ease;
    }
    .whale-widget.dock-left .bubble { right: auto; left: 8px; }
    .bubble.show { opacity: 1; transform: translateY(0); }

    /* 设置抽屉 */
    .settings-panel {
      display: none; position: fixed; inset: 58px 12px 54px 12px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px; overflow-y: auto; z-index: 30;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
    }
    .settings-panel.open { display: block; }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .field input, .field select {
      width: 100%; padding: 7px 9px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); color: var(--fg);
      user-select: text;
    }
    .footer-note {
      font-size: 11px; color: var(--muted); text-align: center;
      padding: 6px; background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="top-bar">
      <div><strong>🐋 小鲸鱼余额挂件</strong> <span class="pill">0 Token</span></div>
      <div style="display:flex;gap:6px;">
        <button class="btn" id="btn-sim">-0.88 模拟消费</button>
        <button class="btn" id="btn-refresh">刷新</button>
        <button class="btn primary" id="btn-settings">设置</button>
      </div>
    </div>

    <div style="text-align:center;color:var(--muted);font-size:12px;padding:12px;">
      拖拽下方小鲸鱼到任意位置，松手自动贴边吸附；拖到左侧自动镜像翻转！点一点会 QQ 弹弹～
    </div>

    <!-- QQ 弹弹小鲸鱼 -->
    <div class="whale-widget" id="whale">
      <div class="bubble" id="bubble">余额充足，继续写代码吧！</div>
      <div class="whale-avatar">
        <svg class="whale-svg" viewBox="0 0 120 120">
          <defs>
            <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#60a5fa"/>
              <stop offset="100%" stop-color="#2563eb"/>
            </linearGradient>
          </defs>
          <!-- 水花 -->
          <path d="M52 24 Q52 14 44 12 M58 24 Q58 14 66 12" stroke="#38bdf8" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <!-- 尾巴 -->
          <path d="M88 64 C104 54, 112 46, 110 36 C102 42, 97 47, 94 52 C92 44, 86 38, 78 39 C84 48, 86 56, 86 64 Z" fill="#3b82f6"/>
          <!-- 身体 -->
          <path d="M18 72 C18 40, 48 30, 74 38 C90 43, 98 56, 95 72 C92 88, 76 96, 54 96 C32 96, 18 88, 18 72 Z" fill="url(#bodyGrad)"/>
          <!-- 肚皮 -->
          <path d="M24 76 C28 90, 46 94, 64 93 C74 92, 82 88, 86 82 C68 84, 42 84, 24 76 Z" fill="#e0f2fe"/>
          <!-- 眼睛 -->
          <circle cx="42" cy="60" r="5" fill="#0f172a"/>
          <circle cx="40.5" cy="58.5" r="1.8" fill="#ffffff"/>
          <!-- 腮红 -->
          <ellipse cx="33" cy="68" rx="5" ry="2.8" fill="#fda4af" fill-opacity="0.8"/>
          <!-- 微笑 -->
          <path d="M49 69 Q54 74 59 69" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="balance-info">
        <div class="balance-label">
          <span id="provider-tag">DEMO</span>
          <span id="currency-tag">CNY</span>
        </div>
        <div class="balance-num" id="balance-val">¥42.88</div>
      </div>
    </div>

    <!-- 设置面板 -->
    <div class="settings-panel" id="settings">
      <h3 style="margin:0 0 10px 0;">⚙️ 余额接口设置</h3>
      <div class="field">
        <label>数据源模式</label>
        <select id="cfg-provider">
          <option value="demo">演示模式（无需 Key）</option>
          <option value="deepseek">DeepSeek 官方余额 API</option>
          <option value="custom">自定义 JSON 余额接口</option>
        </select>
      </div>
      <div class="field">
        <label>API Key（仅保存在本机 <code>~/.gemini/config/plugin-data/</code>，不会上传）</label>
        <input id="cfg-key" type="password" placeholder="sk-...（留空则保持原 Key 不变）" />
      </div>
      <div class="field" id="custom-url-wrap" style="display:none;">
        <label>自定义接口 URL</label>
        <input id="cfg-url" type="text" placeholder="https://example.com/user/balance" />
      </div>
      <div class="field">
        <label>低余额提醒阈值</label>
        <input id="cfg-threshold" type="number" step="0.5" value="5" />
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn primary" id="cfg-save">保存并刷新</button>
        <button class="btn" id="cfg-close">关闭</button>
      </div>
    </div>

    <div class="footer-note" id="footer-info">
      Inspired by MeteorNOX/DeepSeek-Balance-Whale-Widget (MIT) · 纯本地只读查询，0 LLM Token 消耗
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const whale = $('whale');
    const stage = $('stage');
    const bubble = $('bubble');
    let displayedBalance = 42.88;
    let lowThreshold = 5.0;
    let bubbleTimer = null;

    const QUOTES = [
      '戳我干嘛，快去写代码！(๑•̀ㅂ•́)و✧',
      '余额盯紧中，绝不让你超支～',
      '噗噜噜～今天也是 0 Token 消耗的一天！',
      '拖动我可以贴边吸附，拖去左边还会翻身哦！',
    ];

    function say(text, ms = 2600) {
      bubble.textContent = text;
      bubble.classList.add('show');
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => bubble.classList.remove('show'), ms);
    }

    function squish() {
      whale.classList.remove('squish');
      void whale.offsetWidth;
      whale.classList.add('squish');
    }

    // 数字滚动动画
    function animateBalance(target, currency = 'CNY') {
      const symbol = currency === 'USD' ? '$' : '¥';
      const start = displayedBalance;
      const diff = target - start;
      const duration = 650;
      const t0 = performance.now();
      const el = $('balance-val');
      el.classList.toggle('low', target <= lowThreshold);

      function step(now) {
        const p = Math.min(1, (now - t0) / duration);
        const eased = 1 - Math.pow(1 - p, 3);
        const cur = start + diff * eased;
        el.textContent = `${symbol}${cur.toFixed(2)}`;
        if (p < 1) requestAnimationFrame(step);
        else displayedBalance = target;
      }
      requestAnimationFrame(step);
    }

    async function refreshBalance() {
      const res = await fetch('/api/balance').then((r) => r.json());
      if (!res.ok) {
        say(`查询失败: ${res.error}`, 3500);
        return;
      }
      $('provider-tag').textContent = (res.provider || 'DEMO').toUpperCase();
      $('currency-tag').textContent = res.currency || 'CNY';
      animateBalance(Number(res.totalBalance || 0), res.currency);
      squish();
      if (res.totalBalance <= lowThreshold) {
        say(`⚠️ 余额偏低 (${res.totalBalance.toFixed(2)})，记得充值哦！`, 3500);
      } else if (res.note) {
        say(res.note, 2600);
      }
    }

    // 拖拽 + 左右吸附 + 左吸附翻转
    let dragging = false, moved = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;

    whale.addEventListener('pointerdown', (e) => {
      dragging = true; moved = false;
      whale.setPointerCapture(e.pointerId);
      whale.classList.add('dragging');
      const rect = whale.getBoundingClientRect();
      const sRect = stage.getBoundingClientRect();
      origLeft = rect.left - sRect.left;
      origTop = rect.top - sRect.top;
      startX = e.clientX; startY = e.clientY;
      whale.style.right = 'auto';
      whale.style.bottom = 'auto';
      whale.style.left = `${origLeft}px`;
      whale.style.top = `${origTop}px`;
    });

    whale.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      const maxX = stage.clientWidth - whale.offsetWidth - 8;
      const maxY = stage.clientHeight - whale.offsetHeight - 48;
      const nx = Math.max(8, Math.min(maxX, origLeft + dx));
      const ny = Math.max(58, Math.min(maxY, origTop + dy));
      whale.style.left = `${nx}px`;
      whale.style.top = `${ny}px`;
    });

    whale.addEventListener('pointerup', () => {
      if (!dragging) return;
      dragging = false;
      whale.classList.remove('dragging');
      if (!moved) {
        squish();
        say(QUOTES[Math.floor(Math.random() * QUOTES.length)]);
        return;
      }
      // 自动贴边吸附 & 左吸附镜像翻转
      const rect = whale.getBoundingClientRect();
      const sRect = stage.getBoundingClientRect();
      const centerX = rect.left - sRect.left + rect.width / 2;
      if (centerX < sRect.width / 2) {
        whale.style.left = '12px';
        whale.classList.add('dock-left');
        say('贴到左边啦～翻个身继续盯余额！');
      } else {
        whale.style.left = `${Math.max(12, sRect.width - rect.width - 12)}px`;
        whale.classList.remove('dock-left');
        say('回到右边守护岗位！');
      }
      squish();
    });

    // 模拟消费按钮（演示滚动动画）
    $('btn-sim').onclick = async () => {
      const next = Math.max(0, Number((displayedBalance - 0.88).toFixed(2)));
      await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ demoBalance: next }),
      });
      refreshBalance();
    };
    $('btn-refresh').onclick = refreshBalance;

    // 设置面板
    $('cfg-provider').onchange = () => {
      $('custom-url-wrap').style.display = $('cfg-provider').value === 'custom' ? 'block' : 'none';
    };
    $('btn-settings').onclick = async () => {
      const cfg = await fetch('/api/config').then((r) => r.json());
      $('cfg-provider').value = cfg.provider || 'demo';
      $('cfg-url').value = cfg.customUrl || '';
      $('cfg-threshold').value = cfg.lowThreshold ?? 5;
      $('cfg-key').placeholder = cfg.hasApiKey ? `已配置 (${cfg.maskedKey})，留空不变` : 'sk-...';
      $('custom-url-wrap').style.display = cfg.provider === 'custom' ? 'block' : 'none';
      $('settings').classList.add('open');
    };
    $('cfg-close').onclick = () => $('settings').classList.remove('open');
    $('cfg-save').onclick = async () => {
      lowThreshold = Number($('cfg-threshold').value || 5);
      await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          provider: $('cfg-provider').value,
          apiKey: $('cfg-key').value,
          customUrl: $('cfg-url').value,
          lowThreshold,
        }),
      });
      $('cfg-key').value = '';
      $('settings').classList.remove('open');
      refreshBalance();
    };

    refreshBalance();
  </script>
</body>
</html>
